name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: "Backend — Lint, Type Check & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ENABLE_FILE_LOGGING: "false"
      SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint with ruff
        run: poetry run ruff check src/

      - name: Check formatting with ruff
        run: poetry run ruff format --check src/

      # Fails on medium or high severity; low findings are only listed.
      # Same version as the pre-commit hook.
      - name: Security scan with bandit
        run: |
          pip install "bandit[toml]==1.8.0"
          bandit -c pyproject.toml -r src -ll

      # Blocking on the paths already clean: the domain core of catalog and
      # alerts, plus both modules' request validators and alerts' adapters.
      # Imported modules are followed silently, so their errors (fixed area
      # by area) do not fail this step. Add paths as they clean.
      - name: Type check with mypy (blocking, clean paths)
        run: |
          poetry run mypy --follow-imports=silent \
            src/app/catalog/entities.py \
            src/app/catalog/use_cases.py \
            src/app/catalog/http/validators.py \
            src/app/alerts/entities.py \
            src/app/alerts/use_cases.py \
            src/app/alerts/http/validators.py \
            src/app/alerts/ports.py \
            src/app/alerts/persistence/stores.py \
            src/app/alerts/persistence/owners.py \
            src/app/alerts/persistence/mailer.py \
            src/app/alerts/persistence/keyword_searches.py

      - name: Type check with mypy (whole backend, report only)
        run: poetry run mypy src/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          poetry run pytest src/tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && !env.ACT
        env:
          ACT: ${{ env.ACT }}
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ── Scrapers ───────────────────────────────────────────────────────────────
  scrapers:
    name: "Scrapers — Lint & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint with ruff
        run: poetry run ruff check src/

      - name: Check formatting with ruff
        run: poetry run ruff format --check src/

      - name: Run tests
        run: |
          poetry run pytest src/tests/ \
            --cov=src \
            --cov-report=term-missing \
            -v

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — Lint & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type check and build
        run: npm run build

  # ── Public pages (Next.js) ───────────────────────────────────────────────
  web:
    name: "Web — Type Check, Tests & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
