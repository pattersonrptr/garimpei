# Weekly dependency updates. Minor and patch bumps are grouped into one PR
# per folder to keep the noise low; major bumps come one by one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # passlib (unmaintained) breaks with bcrypt 5 (#141). Remove once
      # passlib is replaced.
      - dependency-name: bcrypt
        versions: [">=5"]
      # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3; we use psycopg2
      # (#139). Remove once the driver is switched.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scrapers
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Celery's transport (kombu) supports redis-py <6.5 only. Remove this
      # once kombu raises its cap (see #125).
      - dependency-name: redis
        versions: [">=6.5"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Types follow the Node runtime (node:22 in web/Dockerfile, #131).
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint accepts TypeScript <6 only. Remove this once it
      # supports newer versions (see #123).
      - dependency-name: typescript
        versions: [">=6"]
      # @mui/x-data-grid 8 supports @mui/material <=7 only (#138).
      - dependency-name: "@mui/material"
        versions: [">=8"]
      - dependency-name: "@mui/icons-material"
        versions: [">=8"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
