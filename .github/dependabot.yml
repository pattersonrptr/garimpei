# Weekly dependency updates. Minor and patch bumps are grouped into one PR
# per folder to keep the noise low; major bumps come one by one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scrapers
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Celery's transport (kombu) supports redis-py <6.5 only. Remove this
      # once kombu raises its cap (see #125).
      - dependency-name: redis
        versions: [">=6.5"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
