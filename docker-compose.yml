services:
  # ── Backend API ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./backend
      args:
        BUILD_ENV: dev
    container_name: web
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailpit
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_monitor
      - PYTHONPATH=/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
      # Email: Mailpit (local inbox at http://localhost:8026) by default;
      # set EMAIL_BACKEND=sendgrid + SENDGRID_API_KEY to send real emails.
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@garimpei.com}
      - NOTIFICATION_FROM_NAME=${NOTIFICATION_FROM_NAME:-Garimpei}
      - NOTIFICATION_RATE_LIMIT_MINUTES=${NOTIFICATION_RATE_LIMIT_MINUTES:-60}
    volumes:
      - ./backend/alembic:/src/alembic
      - ./backend:/src
    command: ./start.sh
    restart: unless-stopped

  # ── Scraper Workers ──────────────────────────────────────────────────────
  scraper:
    build:
      context: ./scrapers
      args:
        BUILD_ENV: dev
    depends_on:
      - db
      - redis
      - web
    environment:
      - API_URL=http://web:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
      # Residential proxy for Mercado Livre (optional — disabled by default)
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
    # Runs on the author's PC next to games: capped so collection never
    # competes for the machine (Phase 2, decision 1).
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    restart: unless-stopped
    volumes:
      - ./scrapers:/src
    command:
      [
        "celery",
        "-A",
        "src.celery.tasks",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--pool=prefork",
        "--hostname=scraper-%h",
      ]

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./scrapers
      args:
        BUILD_ENV: dev
    container_name: celery-beat
    depends_on:
      - scraper
      - redis
      - web
    environment:
      - API_URL=http://web:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
      # Residential proxy for Mercado Livre (optional — disabled by default)
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
    volumes:
      - ./scrapers:/src
    command: celery -A src.celery.tasks beat --loglevel=info
    # Beat starts the daily offer collection; it must come back after a reboot.
    restart: unless-stopped

  # ── Flower (Celery Monitoring) ───────────────────────────────────────────
  flower:
    build:
      context: ./scrapers
    container_name: flower
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: celery -A src.celery.tasks flower --port=5555

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:13
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: price_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ── Mailpit (local email inbox for development) ─────────────────────────
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025" # web UI; SMTP (1025) stays inside the compose network

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    # Keeps the collectors' per-store state (day done, week-long pauses).
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ── Public pages (Next.js, Phase 3) ─────────────────────────────────────
  site:
    build:
      context: ./web
    container_name: site
    ports:
      - "3000:3000"
    depends_on:
      - web
    environment:
      # The server-side fetches go to the API inside the compose network.
      - API_URL=http://web:8000
      # Amazon Associates tag for the "see on Amazon" link (empty: plain link).
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG:-}
      # Public address, for canonical links, the sitemap and structured data.
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      # The logged-in app (Vite), where "warn me" creates an alert after login.
      - APP_URL=${APP_URL:-http://localhost}
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: product-tracker-front
    container_name: product-tracker-front
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
